name: Build Raspberry Pi image

# Builds a flashable 64-bit (arm64) Raspberry Pi OS Lite image with Family
# Calendar + a Chromium/cage kiosk baked in. Run on demand (Actions tab) or on a
# published release (the .img.xz is attached to the release).
#
# 64-bit (arm64) covers Pi 5 / 4 / 400 / CM4 and also boots Pi 3 / Zero 2 W. A
# 32-bit (armhf) image is intentionally NOT built: pi-gen's 32-bit stage is
# unbuildable in CI (i386 base rejected by BuildKit) and a Chromium/Wayland
# kiosk isn't viable on pre-64-bit boards anyway.
#
# Approach mirrors the sibling home-display appliance: a NATIVE arm64 runner
# (no QEMU/binfmt emulation) + a pinned, current pi-gen release tag (up-to-date
# Debian keyrings, so debootstrap doesn't fail on GPG NO_PUBKEY).

on:
  workflow_dispatch: {}
  release:
    types: [published]

permissions:
  contents: write # attach the image to the release

jobs:
  build-image:
    # Native ARM64 runner (free for public repos) → pi-gen builds the arm64
    # rootfs natively, avoiding the emulation that fails on x86 runners.
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image (arm64 / 64-bit)
        id: build
        uses: usimd/pi-gen-action@v1.11.0
        with:
          image-name: family-calendar-arm64
          # Raspberry Pi OS Lite = stages 0–2, then our app + kiosk stage.
          stage-list: stage0 stage1 stage2 ./pi-gen/stage-family-calendar
          release: bookworm
          # Pin a real, current 64-bit Bookworm release tag — the `arm64` branch
          # is stale and fails debootstrap GPG verification (NO_PUBKEY).
          pi-gen-version: 2026-06-18-raspios-bookworm-arm64
          hostname: familycalendar
          username: pi
          password: changeme # default — change after first login
          enable-ssh: 1
          disable-first-boot-user-rename: 1
          verbose-output: true
          compression: xz
          compression-level: 6
        env:
          FC_REPO: https://github.com/${{ github.repository }}.git
          FC_BRANCH: ${{ github.ref_name }}

      - name: Attach image to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.build.outputs.image-path }}

      - name: Upload image as a workflow artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: family-calendar-arm64
          path: ${{ steps.build.outputs.image-path }}
          retention-days: 14
