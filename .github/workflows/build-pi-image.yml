name: Build Raspberry Pi image

# Builds a ready-to-flash Raspberry Pi OS Lite image with Family Calendar +
# kiosk baked in. Trigger manually (Actions → Build Raspberry Pi image → Run)
# or on a published release. The build runs pi-gen under ARM emulation and
# takes ~30–60 min.
#
# The default is a 32-bit (armhf) image so it boots on Pi 2, Pi 3 AND Pi 4.

on:
  workflow_dispatch:
    inputs:
      password:
        description: 'Password for the "pi" user (change this!)'
        required: true
        default: 'changeme'
      hostname:
        description: 'Device hostname (mDNS: <hostname>.local)'
        required: false
        default: 'familycalendar'
  release:
    types: [published]

jobs:
  build-image:
    runs-on: ubuntu-latest
    env:
      # pi-gen's 32-bit build uses a `FROM i386/debian` Docker stage. Modern
      # BuildKit rejects that base image's platform (InvalidBaseImagePlatform);
      # the legacy builder tolerates it. Force the legacy builder.
      DOCKER_BUILDKIT: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Register binfmt handlers so pi-gen's i386/armhf Docker stages run under
      # emulation on the amd64 runner (fixes InvalidBaseImagePlatform).
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Build image with pi-gen
        id: build
        uses: usimd/pi-gen-action@v1
        env:
          # Legacy builder for pi-gen's docker build: modern BuildKit fails the
          # build on the harmless "git not found" provenance warning.
          DOCKER_BUILDKIT: '0'
        with:
          image-name: family-calendar
          # Raspberry Pi OS Lite = stages 0–2, then our app stage.
          stage-list: stage0 stage1 stage2 ./pi-gen/stage-family-calendar
          release: bookworm
          # arm64 (64-bit) image → runs on Pi 3 and Pi 4.
          # NOTE: the 32-bit ('master') branch is currently unbuildable in CI —
          # its `FROM i386/debian` Docker stage is rejected by BuildKit on the
          # amd64 runner (InvalidBaseImagePlatform). arm64 avoids that base
          # entirely. Trade-off: arm64 does NOT boot on Pi 2 (ARMv7, 32-bit only).
          pi-gen-version: arm64
          hostname: ${{ github.event.inputs.hostname || 'familycalendar' }}
          username: pi
          password: ${{ github.event.inputs.password || 'changeme' }}
          enable-ssh: 1
          # emoji + build deps are installed by the stage's 00-packages.
          verbose-output: true
          # Compress so the uploaded artifact is a flashable .img.xz.
          compression: xz
          compression-level: 6

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: family-calendar-pi-image
          path: ${{ steps.build.outputs.image-path }}
          if-no-files-found: error

      - name: Attach image to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.build.outputs.image-path }}
